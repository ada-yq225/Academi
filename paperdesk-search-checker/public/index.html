<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperDesk 自主查重</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">PaperDesk <span>自主查重 · 测试版</span></div><p>找到来源，定位重复文字。 <a href="/benchmarks.html">查看扩大测试记录</a> · <a href="/sources.html">来源可用性实测</a></p></header><main>
<section class="card"><div class="heading"><h1>提交文稿</h1><label class="filebutton">选择文稿<input id="file" type="file" accept=".txt,.pdf,.docx"></label></div><p class="hint">支持中英文 · TXT、DOCX、文字型 PDF · 单个不超过 10 MB</p><textarea id="text" placeholder="粘贴文稿，或选择文件。检测会向搜索服务发送部分文字片段以查找来源。"></textarea><div class="row"><span id="count">0 字符</span><label>检索范围 <select id="queries"><option value="6">快速：6 个片段</option><option value="12">扩展：12 个片段</option><option value="0">仅比对指定来源</option></select></label></div>
<details><summary>添加已知来源或自有参考文稿</summary><label>来源网址（每行一个，最多10个）<textarea id="urls" class="short" placeholder="https://example.org/article"></textarea></label><label>自有参考文稿（可选）<textarea id="reference" class="short" placeholder="粘贴你有权使用的参考文本，可离线比对"></textarea></label></details>
<button id="check" class="primary">开始查重</button><p class="hint">比对公开可访问内容；付费或未公开全文可能无法获取。任务结果仅临时保存在本机内存，30分钟后清理。</p><div id="progress" role="status"></div></section>
<section id="output" class="hidden"><div class="card"><div class="heading"><h2>检测结果</h2><div class="download-actions"><button id="downloadPdf">下载 PDF 报告</button><button id="download">保存 JSON 结果</button></div></div><div id="metrics" class="metrics"></div><p id="coverage" class="hint"></p><p class="note">分数是已获取来源中的文字重复占比，不代表全互联网重复率。高亮表示匹配文字，不能单独作为抄袭结论。</p><details id="diagnostics"><summary>检索范围与未获取的来源</summary><div id="errors"></div></details></div><div class="switch"><h2>逐句匹配与来源</h2><label><input id="onlyMatched" type="checkbox">仅显示有匹配的句子</label></div><div id="sentences"></div></section>
</main><script type="module" src="/app.js"></script></body></html>
